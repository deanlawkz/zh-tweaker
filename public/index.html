<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZH Tweaker</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">ZH <b>Tweaker</b><span class="sub" data-en="Generals Zero Hour · Commander faction">Generals Zero Hour · фракция Commander</span></div>
    <div class="status" id="status"></div>
    <div class="actions">
      <button id="btn-apply" class="primary" data-en="Apply">Применить</button>
      <button id="btn-reset" data-en="Reset all">Сбросить всё</button>
      <button id="btn-play" class="play" data-en="Play">Играть</button>
      <button id="btn-lang" class="lang" title="Язык / Language">EN</button>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="units" class="on" data-en="Units and buildings">Юниты и здания</button>
    <button data-tab="build" data-en="Build lists">Что строят здания</button>
    <button data-tab="weapons" data-en="Weapons">Оружие</button>
    <button data-tab="general" data-en="Camera and general">Камера и общее</button>
    <button data-tab="commander">Commander</button>
    <button data-tab="changes"><span data-en="Changes">Изменения</span> <span id="changes-count"></span></button>
  </nav>
  <div id="errors" class="errors" hidden></div>
  <main id="view"></main>
  <div id="modal" class="modal" hidden><div class="modal-box"><div class="modal-head"><span id="modal-title"></span><button id="modal-close">✕</button></div><div id="modal-body"></div></div></div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
